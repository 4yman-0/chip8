[package]
name = "chip8-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", default-features = false, features = ["derive", "help", "std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
rand = { version = "0.10.1", default-features = false, features = ["thread_rng"] }
rand_core = { version = "0.10.1", default-features = false }
